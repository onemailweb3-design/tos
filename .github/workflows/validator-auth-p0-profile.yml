name: Validator P0 profile

on:
  pull_request:
    paths:
      - 'doc/validator-auth-p0/**'
      - 'test/validator-auth-p0/**'
      - '.github/workflows/validator-auth-p0-profile.yml'
      - 'third-party/tl-parser/**'
      - 'tl/generate/scheme/tos_api.tl'
      - 'tl/generate/scheme/lite_api.tl'
      - 'crypto/block/block.tlb'
      - 'tos/tos-types.h'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: validator-p0-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check reference bytes, real C0 signatures and persistent schema constraints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          git archive --format=tar HEAD doc/validator-auth-p0 test/validator-auth-p0 \
            third-party/tl-parser tl/generate/scheme crypto/block/block.tlb tos/tos-types.h \
            validator/consensus validator/manager.cpp keyring/keyring.h AGENTS.md \
            .github/workflows/validator-auth-p0-profile.yml > artifacts/source.tar
          sha256sum artifacts/source.tar > artifacts/source.sha256
          python3 --version > artifacts/toolchain.txt
          openssl version >> artifacts/toolchain.txt
          gzip -dc test/validator-auth-p0/golden.json.gz > artifacts/golden.json
          python3 test/validator-auth-p0/test_profile.py -v 2>&1 | tee artifacts/tests.log
          python3 test/validator-auth-p0/mutations.py --out artifacts/mutations.json
      - name: Compile the native TL parser and reject incompatible schema
        shell: bash
        run: |
          set -euo pipefail
          cmake -S third-party/tl-parser -B build-p0-schema -G Ninja
          cmake --build build-p0-schema -j2
          python3 test/validator-auth-p0/check_schema.py --tl-parser build-p0-schema/tl-parser --out artifacts/schema.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validator-p0-profile
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
