[package]
name = "shielded-pool-circuit"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shielded pool V1 circuit: Poseidon2 t=8 gadgets, note/tree relations and the Groth16 development fixtures, built to the frozen implementation profile."

[dependencies]
ark-bls12-381 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-r1cs-std = "=0.5.0"
ark-relations = "=0.5.1"
ark-serialize = "=0.5.0"
ark-snark = "=0.5.1"
ark-std = "=0.5.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
rand_chacha = "=0.3.1"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
