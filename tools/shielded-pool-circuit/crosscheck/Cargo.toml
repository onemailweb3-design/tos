[package]
name = "shielded-pool-circuit-crosscheck"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the shielded FunC library in the VM and compares it against the circuit gadgets, value for value."

[dependencies]
shielded-pool-circuit = { path = ".." }
shielded-pool-wallet = { path = "../../shielded-pool-wallet" }
shielded-pool-genesis = { path = "../../shielded-pool-genesis" }
chain_block = { path = "../../../tosctl/src/block" }
tos_sandbox = { path = "../../../tosctl/src/sandbox" }
tos_vm = { path = "../../../tosctl/src/vm" }
serde_json = "=1.0.145"
ark-ff = "=0.5.0"
# Test-only ML-DSA-44 signer. The chain ships a verifier only, so an
# end-to-end transaction needs a signer to produce signatures over a digest
# the contract itself computes. Pinned exactly; never used outside tests.
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
